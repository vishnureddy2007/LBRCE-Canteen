<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- App Icon Background -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#bgGrad)" stroke="#3B82F6" stroke-width="2"/>

  <!-- LBRCE College Building Silhouette background -->
  <path d="M 22 55 L 22 45 L 34 35 L 50 25 L 66 35 L 78 45 L 78 55 Z" fill="#2563EB" opacity="0.35"/>
  <rect x="46" y="28" width="8" height="10" fill="url(#goldGrad)" opacity="0.6"/>
  <polygon points="50,20 44,28 56,28" fill="url(#goldGrad)"/>

  <!-- Food Cloche Dome -->
  <path d="M 26 58 C 26 40, 74 40, 74 58 Z" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="50" cy="38" r="3.5" fill="url(#goldGrad)"/>
  <line x1="22" y1="58" x2="78" y2="58" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Crossed Fork & Spoon -->
  <!-- Fork -->
  <path d="M 38 64 L 38 78 M 35 64 V 70 M 41 64 V 70 M 35 70 Q 38 74 41 70" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
  <!-- Spoon -->
  <path d="M 62 64 L 62 78 M 59 64 C 59 70 65 70 65 64 Z" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Mobile Ordering Pulse Motif (Orange Lightning / Beacon) -->
  <path d="M 50 60 L 44 72 H 51 L 49 83 L 58 69 H 51 Z" fill="url(#orangeGrad)"/>
</svg>

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    remoteip:
      internal-proxies: ".*"
    threads:
      max: 500
      min-spare: 20
    max-connections: 10000
    accept-count: 200
  servlet:
    session:
      timeout: 24h
      cookie:
        name: LBRCESESSION
        same-site: ${COOKIE_SAME_SITE:lax}
        secure: ${COOKIE_SECURE:false}
        http-only: true

spring:
  application:
    name: lbrce-canteen-backend

  # Defaults allow immediate local or docker runs without requiring manual exports
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/lbrce_canteen?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=10000&socketTimeout=30000}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      pool-name: LbrceHikariPool
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000
      validation-timeout: 3000
      keepalive-time: 30000
      leak-detection-threshold: 30000
      connection-test-query: SELECT 1

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    show-sql: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

# Where uploaded food images are written if Cloudinary is not configured.
app:
  upload:
    dir: uploads
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}

# Cloudinary configuration
cloudinary:
  url: ${CLOUDINARY_URL:}
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

# Logging
logging:
  level:
    root: INFO
    com.lbrce.canteen: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
